[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
verbosity = 3

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base_sepolia_fallback = "https://base-sepolia-rpc.publicnode.com"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
